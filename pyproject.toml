[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cudaq-metal"
version = "0.3.0"
description = "Unofficial Metal (Apple GPU) statevector simulator backend for NVIDIA CUDA-Q on Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vincent" }]
keywords = ["cudaq", "cuda-quantum", "quantum", "simulator", "metal", "apple-silicon", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
# The bundled libnvqir-metal.dylib is ABI-matched to one CUDA-Q minor version.
# On macOS `pip install cudaq` resolves to the cuda-quantum-cu13 binary wheel,
# so that is the distribution we pin. Bump together with COMPATIBLE_CUDAQ in
# cudaq_metal/_install.py whenever the binary is rebuilt for a new CUDA-Q.
dependencies = ["cuda-quantum-cu13>=0.16.0,<0.17"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cudaq-metal-install = "cudaq_metal._install:_main"

[project.urls]
Homepage = "https://github.com/vivanwin/cudaq-metal"
Repository = "https://github.com/vivanwin/cudaq-metal"
Issues = "https://github.com/vivanwin/cudaq-metal/issues"
"CUDA-Q (upstream)" = "https://github.com/NVIDIA/cuda-quantum"

[tool.setuptools.packages.find]
where = ["."]
include = ["cudaq_metal*"]

[tool.setuptools.package-data]
cudaq_metal = ["data/*.dylib", "data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The CUDA-Q .* will change:FutureWarning"]
