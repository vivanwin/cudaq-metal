# ============================================================================ #
# Naive Apple-GPU (Metal) statevector backend target.                          #
# ============================================================================ #

name: metal
description: "Metal (Apple GPU) statevector simulator (fp32, gates with 1-4 targets)."
config:
  nvqir-simulation-backend: metal
  # Metal has no fp64; the backend is CircuitSimulatorBase<float>, so tell the
  # host side to use single precision too, keeping the two consistent.
  preprocessor-defines: ["-D CUDAQ_SIMULATION_SCALAR_FP32"]
